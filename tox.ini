[tox]
envlist=py{311,315}-{pip,zip}

[testenv]
# tox builds this platform's wheel once (maturin, via PEP 517) and installs it
# into every environment. CI passes the wheels it built with --installpkg
# instead, so the tests run against the exact wheels it would release.
package = wheel
wheel_build_env = .pkg
# The zip distribution only supports Windows and macOS
platform = zip: darwin|win32
changedir = {envtmpdir}
# DISPLAY/XAUTHORITY: winit needs these to find the Xvfb display that
# xvfb-run sets up in CI (see .github/workflows/ci.yml). Without passenv,
# tox strips them from the test subprocess's environment.
passenv = CI,DISPLAY,XAUTHORITY
setenv   =
    PYTHONPATH = {envtmpdir}
    # Test apps run in hidden windows, so they don't take focus from
    # whoever is using the computer
    CMU_GRAPHICS_HIDDEN_WINDOW = 1
deps =
  # These dependencies are need to run test_image_gen.py. No additional
  # dependencies of cmu_graphics need to be listed here.
  psutil
  pillow
commands =
  zip: python {toxinidir}{/}tests{/}install_zip.py {toxinidir}
  python {toxinidir}{/}tests{/}test_cmu_cpcs_utils.py
  python {toxinidir}{/}tests{/}test_get_text_input.py
  python {toxinidir}{/}tests{/}test_sound.py
  python {toxinidir}{/}tests{/}test_image_gen.py
