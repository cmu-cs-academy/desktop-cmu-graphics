[tox]
envlist=py{311,315}-{pip,zip}
skipsdist=True

[testenv]
changedir = {envtmpdir}
# DISPLAY/XAUTHORITY: winit needs these to find the Xvfb display that
# xvfb-run sets up in CI (see .github/workflows/tests.yml). Without passenv,
# tox strips them from the test subprocess's environment.
passenv = CI,DISPLAY,XAUTHORITY
setenv   =
    PYTHONPATH = {envtmpdir}
    # tests/install.py installs cmu_graphics_helpers from the wheels
    # buildwheels.yml committed here, never from PyPI
    UV_FIND_LINKS = {toxinidir}{/}wheels
    # Test apps run in hidden windows, so they don't take focus from
    # whoever is using the computer
    CMU_GRAPHICS_HIDDEN_WINDOW = 1
deps =
  # These dependencies are need to run test_image_gen.py. No additional
  # dependencies of cmu_graphics need to be listed here.
  psutil
  pillow
# TOX_PYTHON_ARCH (e.g. -64-arm64) pins the interpreter's architecture. On
# Windows ARM, uv otherwise picks an x64 Python, even when an ARM64 build
# exists. See .github/workflows/tests.yml.
base_python =
    py311: cpython3.11{env:TOX_PYTHON_ARCH:}
    py315: cpython3.15{env:TOX_PYTHON_ARCH:}
commands =
  pip: python {toxinidir}{/}tests{/}install.py pip {toxinidir}
  zip: python {toxinidir}{/}tests{/}install.py zip {toxinidir}
  python {toxinidir}{/}tests{/}test_cmu_cpcs_utils.py
  python {toxinidir}{/}tests{/}test_get_text_input.py
  python {toxinidir}{/}tests{/}test_sound.py
  python {toxinidir}{/}tests{/}test_image_gen.py
  zip: python {toxinidir}{/}tests{/}check_binaries.py
