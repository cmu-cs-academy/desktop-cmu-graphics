[tox]
envlist=py{38,311,312,313,314}-{pip,zip}
skipsdist=True

[testenv]
changedir = {envtmpdir}
passenv = CI
setenv   =
    PYTHONPATH = {envtmpdir}
    # This is necessary so that tests/install.py can find our
    # wheel for cmu_graphics_helpers
    UV_FIND_LINKS = {toxinidir}{/}cmu_graphics_helpers{/}target{/}wheels
deps =
  # These dependencies are need to run test_image_gen.py. No additional
  # dependencies of cmu_graphics need to be listed here.
  psutil
  pillow
commands =
  pip: python {toxinidir}{/}tests{/}install.py pip {toxinidir}
  zip: python {toxinidir}{/}tests{/}install.py zip {toxinidir}
  python {toxinidir}{/}tests{/}test_cmu_cpcs_utils.py
  python {toxinidir}{/}tests{/}test_get_text_input.py
  python {toxinidir}{/}tests{/}test_sound.py
  python {toxinidir}{/}tests{/}test_image_gen.py
  zip: python {toxinidir}{/}tests{/}check_binaries.py
