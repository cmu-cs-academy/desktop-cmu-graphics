name: Build cmu_graphics_helpers (+ deploy to PyPI if on main)

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/skia-windows-build-env

      - name: Build wheels with maturin
        if: ${{ matrix.os != 'ubuntu-latest' }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: cmu_graphics_helpers
          target: ${{ matrix.target }}
          args: --release

      # Shared with tests.yml, so CI tests the same Linux wheel that's published
      - uses: ./.github/actions/linux-helpers-wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: cmu_graphics_helpers/target/wheels/*.whl

  vendor_binaries:
    name: Commit built binaries to the branch
    needs: build_wheels
    # Don't run on main, where main the wheels are published to PyPI instead.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: wheels
          merge-multiple: true

      # Wheels for platforms the zip distribution does not ship (Linux) and the
      # sdist are ignored by the script.
      - name: Vendor the wheels and commit them
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          modules=cmu_graphics/libs/cmu_graphics_helpers_loader/modules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            python build/helpers/build_cmuhelp_modules.py --wheels wheels
            git add "$modules"

            if git diff --cached --quiet; then
              echo "Vendored binaries are already up to date; nothing to commit."
              exit 0
            fi

            git commit \
              -m "Update vendored cmu_graphics_helpers binaries" \
              -m "Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA."

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Push rejected on attempt $attempt: $branch moved while this run was building."
            echo "Resetting to its current tip and re-vendoring on top of it."
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
          done

          echo "Gave up after 3 attempts; $branch is moving faster than this job can keep up."
          exit 1

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Build SDist
      uses: PyO3/maturin-action@v1
      with:
        working-directory: cmu_graphics_helpers
        args: --sdist

    - uses: actions/upload-artifact@v6
      with:
        path: cmu_graphics_helpers/target/wheels/*.tar.gz
        name: source-distribution

  upload_all:
    name: Upload to PyPi
    needs: [build_wheels, make_sdist]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/