name: Build cmu_graphics_helpers (+ deploy to PyPI if on main)

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: rustup target add ${{ matrix.target }}

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@v1
        with:
          working-directory: cmu_graphics_helpers
          manylinux: auto
          target: ${{ matrix.target }}
          args: --release
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y freetype-devel fontconfig-devel
            elif command -v apt &> /dev/null; then
              apt update -y
              apt install -y pkg-config libfreetype6-dev libfontconfig1-dev
            fi

      # Fail here, in the job that produced the wheel, rather than downstream in
      # the clean-Windows import test. This walks the .pyd's dependencies (and
      # its bundled DLLs' dependencies) and checks each one is either bundled or
      # guaranteed present on a stock Windows machine.
      - name: Check the Windows wheel bundles every DLL it needs
        if: ${{ matrix.os == 'windows-latest' }}
        run: python tests/check_binaries.py --wheel cmu_graphics_helpers/target/wheels

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: cmu_graphics_helpers/target/wheels/*.whl

  test_clean_windows:
    name: Import test on Windows without the VC++ Redistributable
    needs: build_wheels
    # Not windows-latest: process isolation needs the container's OS build to
    # match the host's (ltsc2022), and windows-2022 pre-caches the Server Core
    # image so this does not pay a multi-gigabyte pull.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: wheels-windows-latest-x86_64-pc-windows-msvc
          path: wheels

      - name: Import cmu_graphics_helpers in a clean Windows container
        run: python tests/clean_windows_import_test.py --wheel wheels

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false # Highly recommended as a good security practice to not store credentials in disk, unless you need this for your specific use case

    - name: Build SDist
      uses: PyO3/maturin-action@v1
      with:
        working-directory: cmu_graphics_helpers
        manylinux: auto
        args: --sdist
        before-script-linux: |
          if command -v yum &> /dev/null; then
            yum install -y freetype-devel fontconfig-devel
          elif command -v apt &> /dev/null; then
            apt update -y
            apt install -y pkg-config libfreetype6-dev libfontconfig1-dev
          fi

    - uses: actions/upload-artifact@v6
      with:
        path: cmu_graphics_helpers/target/wheels/*.tar.gz

  upload_all:
    name: Upload to PyPi
    needs: [build_wheels, test_clean_windows, make_sdist]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/