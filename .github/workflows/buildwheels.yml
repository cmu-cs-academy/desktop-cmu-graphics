name: Build cmu_graphics_helpers (vendor to the branch, or deploy to PyPI on main)

on:
  workflow_dispatch:
  push:
    # Not main: there vendor_binaries is skipped and publishing to PyPI is
    # workflow_dispatch-only, so a run would build wheels nothing consumes.
    branches-ignore:
      - main
    # The inputs that change the built wheel -- keep in sync with WATCHED_PATHS
    # in build/check_helpers_version.py -- plus the scripts that vendor and
    # stamp the wheels and the workflow machinery that builds them. Keep in
    # sync with STAMPED_PATHS in build/helpers/wheel_stamp.py too: tests fail
    # on a change to any of these until this workflow commits new wheels.
    paths:
      - cmu_graphics_helpers/**
      - .cargo/config.toml
      - build/helpers/build_cmuhelp_modules.py
      - build/helpers/wheel_stamp.py
      - .github/workflows/buildwheels.yml
      - .github/actions/linux-helpers-wheel/**
      - .github/actions/rust-build-env/**

# One live run per branch. A superseded run would only vendor wheels built from
# an older commit, and vendor_binaries pushes to the branch, so let it go.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/rust-build-env

      - name: Build wheels with maturin
        if: ${{ matrix.os != 'ubuntu-latest' }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: cmu_graphics_helpers
          target: ${{ matrix.target }}

      - uses: ./.github/actions/linux-helpers-wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: cmu_graphics_helpers/target/wheels/*.whl

  vendor_binaries:
    name: Commit built wheels and binaries to the branch
    needs: build_wheels
    # Don't run on main, where main the wheels are published to PyPI instead.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: built-wheels
          merge-multiple: true

      # Commits the wheels to wheels/, where tests install the pip
      # distribution from, and vendors the same wheels into the zip
      # distribution's module tree (which skips Linux). The stamp records the
      # source they were built from, so tests can tell whether they're stale.
      - name: Commit the wheels and vendored binaries
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          modules=cmu_graphics/libs/cmu_graphics_helpers_loader/modules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            rm -rf wheels
            mkdir wheels
            cp built-wheels/*.whl wheels/
            # Stamp the commit the wheels were built from, not the branch tip,
            # which may have moved on by a retry
            python build/helpers/wheel_stamp.py write --rev "$GITHUB_SHA"
            python build/helpers/build_cmuhelp_modules.py --wheels wheels
            git add --all wheels "$modules"

            if git diff --cached --quiet; then
              echo "Wheels and vendored binaries are already up to date; nothing to commit."
              exit 0
            fi

            git commit \
              -m "Update cmu_graphics_helpers wheels and vendored binaries" \
              -m "Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA."

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Push rejected on attempt $attempt: $branch moved while this run was building."
            echo "Resetting to its current tip and re-vendoring on top of it."
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
          done

          echo "Gave up after 3 attempts; $branch is moving faster than this job can keep up."
          exit 1

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Build SDist
      uses: PyO3/maturin-action@v1
      with:
        working-directory: cmu_graphics_helpers
        command: sdist

    - uses: actions/upload-artifact@v6
      with:
        path: cmu_graphics_helpers/target/wheels/*.tar.gz
        name: source-distribution

  upload_all:
    name: Upload to PyPi
    needs: [build_wheels, make_sdist]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/