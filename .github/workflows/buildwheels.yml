name: Build cmu_graphics_helpers and commit it to the branch

on:
  workflow_dispatch:
  push:
    # Not main: there vendor_binaries is skipped, so a run would build wheels
    # nothing consumes. Changes reach main through PRs, which carry the wheels
    # built for them, and release.yml publishes those wheels to PyPI.
    branches-ignore:
      - main
    # The inputs that change the built wheel -- keep in sync with WATCHED_PATHS
    # in build/check_helpers_version.py -- plus the scripts that vendor and
    # stamp the wheels and the workflow machinery that builds them. Keep in
    # sync with STAMPED_PATHS in build/helpers/wheel_stamp.py too: tests fail
    # on a change to any of these until this workflow commits new wheels.
    paths:
      - cmu_graphics_helpers/**
      - .cargo/config.toml
      - build/helpers/build_cmuhelp_modules.py
      - build/helpers/wheel_stamp.py
      - .github/workflows/buildwheels.yml
      - .github/actions/linux-helpers-wheel/**
      - .github/actions/rust-build-env/**

# One live run per branch. A superseded run would only vendor wheels built from
# an older commit, and vendor_binaries pushes to the branch, so let it go.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: rustup target add ${{ matrix.target }}

      - uses: ./.github/actions/rust-build-env

      - name: Build wheels with maturin
        if: ${{ matrix.os != 'ubuntu-latest' }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: cmu_graphics_helpers
          target: ${{ matrix.target }}

      - uses: ./.github/actions/linux-helpers-wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: cmu_graphics_helpers/target/wheels/*.whl

  vendor_binaries:
    name: Commit built wheels and binaries to the branch
    needs: build_wheels
    # Don't run on main (see the push trigger above)
    if: github.ref != 'refs/heads/main'
    # macOS for codesign and notarytool. The macos-signing environment holds
    # the signing secrets.
    runs-on: macos-latest
    environment: macos-signing
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: built-wheels
          merge-multiple: true

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -A -t cert
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          # Search the new keychain, so codesign finds the certificate
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # Vendors the wheels into the zip distribution's module tree (which
      # skips Linux), then signs and notarizes the macOS binaries there.
      # notarize.py works on ../cmu_graphics. This happens once, before the
      # commit loop below, since notarizing takes minutes; the loop copies the
      # signed modules back in on each attempt.
      - name: Vendor, sign, and notarize the binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          modules=cmu_graphics/libs/cmu_graphics_helpers_loader/modules
          python3 build/helpers/build_cmuhelp_modules.py --wheels built-wheels
          (cd build && uv run --no-project --with tqdm python notarize.py)
          cp -R "$modules" "$RUNNER_TEMP/signed-modules"

      # Commits the wheels to wheels/, where tests install the pip
      # distribution from, and the signed vendored modules. The stamp records
      # the source they were built from, so tests can tell whether they're
      # stale.
      - name: Commit the wheels and vendored binaries
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          modules=cmu_graphics/libs/cmu_graphics_helpers_loader/modules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            rm -rf wheels
            mkdir wheels
            cp built-wheels/*.whl wheels/
            # Stamp the commit the wheels were built from, not the branch tip,
            # which may have moved on by a retry
            python3 build/helpers/wheel_stamp.py write --rev "$GITHUB_SHA"
            rm -rf "$modules"
            cp -R "$RUNNER_TEMP/signed-modules" "$modules"
            git add --all wheels "$modules"

            if git diff --cached --quiet; then
              echo "Wheels and vendored binaries are already up to date; nothing to commit."
              exit 0
            fi

            git commit \
              -m "Update cmu_graphics_helpers wheels and vendored binaries" \
              -m "Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA."

            if git push origin "HEAD:$branch"; then
              exit 0
            fi

            echo "Push rejected on attempt $attempt: $branch moved while this run was building."
            echo "Resetting to its current tip and re-vendoring on top of it."
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
          done

          echo "Gave up after 3 attempts; $branch is moving faster than this job can keep up."
          exit 1

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
