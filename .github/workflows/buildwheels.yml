name: Build cmu_graphics_helpers (+ deploy to PyPI if on main)

on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: rustup target add ${{ matrix.target }}

      # Building Skia from source (see .cargo/config.toml) runs bindgen, which
      # needs libclang. The prebuilt binaries carry pre-generated bindings, so
      # this was not needed before. LLVM is preinstalled on the runner image;
      # locate it rather than hardcoding a path.
      - name: Point bindgen at the runner's LLVM
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Path "C:\Program Files\LLVM", "C:\Program Files (x86)\LLVM" `
            -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            "found $($lib.FullName)"
            "LIBCLANG_PATH=$($lib.DirectoryName)" >> $env:GITHUB_ENV
          } else {
            "libclang.dll not found; leaving bindgen to search PATH"
          }

      # Windows only: it is the one job that builds Skia from source (see
      # .cargo/config.toml), so it is the only one where this pays for itself.
      # The macOS jobs download a prebuilt Skia archive and finish in under a
      # minute, and the Linux job builds inside maturin-action's manylinux
      # container, whose CARGO_HOME is not the host's -- a host-level cache
      # would do nothing for it.
      - name: Cache cargo registry and build artifacts
        if: ${{ matrix.os == 'windows-latest' }}
        uses: Swatinem/rust-cache@v2
        with:
          # The crate is not at the repository root.
          workspaces: cmu_graphics_helpers

      # rust-cache restores all of target/, which includes the wheels maturin
      # wrote on the previous run. A stale wheel left there would be picked up
      # by the delvewheel step's glob and by the upload, so clear the output
      # directories after the cache is restored and before the build.
      - name: Clear stale wheels restored from the cache
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          foreach ($dir in "cmu_graphics_helpers/target/wheels", "cmu_graphics_helpers/target/repaired") {
            if (Test-Path $dir) {
              "removing $dir"
              Remove-Item -Recurse -Force $dir
            }
          }

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@v1
        with:
          working-directory: cmu_graphics_helpers
          manylinux: auto
          target: ${{ matrix.target }}
          args: --release
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y freetype-devel fontconfig-devel
            elif command -v apt &> /dev/null; then
              apt update -y
              apt install -y pkg-config libfreetype6-dev libfontconfig1-dev
            fi

      - name: Install uv
        if: ${{ matrix.os == 'windows-latest' }}
        uses: astral-sh/setup-uv@v6

      - name: Bundle the VC++ runtime into the Windows wheel
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $wheel = Get-ChildItem cmu_graphics_helpers/target/wheels/*.whl
          # Repair into a separate directory and move the result back, rather
          # than passing -w the wheel's own directory. When delvewheel has
          # nothing to vendor it copies the wheel to the target instead of
          # repackaging it, and copying a file onto itself fails on Windows with
          # "WinError 32: the process cannot access the file".
          uv run --only-group delvewheel delvewheel repair --no-mangle-all -w cmu_graphics_helpers/target/repaired $wheel
          Move-Item -Force cmu_graphics_helpers/target/repaired/*.whl cmu_graphics_helpers/target/wheels/

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: cmu_graphics_helpers/target/wheels/*.whl

  test_clean_windows:
    name: Import test on Windows without the VC++ Redistributable
    needs: build_wheels
    # Not windows-latest: process isolation needs the container's OS build to
    # match the host's (ltsc2022), and windows-2022 pre-caches the Server Core
    # image so this does not pay a multi-gigabyte pull.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: wheels-windows-latest-x86_64-pc-windows-msvc
          path: wheels

      - name: Import cmu_graphics_helpers in a clean Windows container
        run: python tests/clean_windows_import_test.py --wheel wheels

  vendor_binaries:
    name: Commit built binaries to the branch
    needs: [build_wheels, test_clean_windows]
    # Don't run on main, where main the wheels are published to PyPI instead.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: wheels
          merge-multiple: true

      # Wheels for platforms the zip distribution does not ship (Linux) and the
      # sdist are ignored by the script.
      - name: Vendor the wheels into cmu_graphics/libs
        run: python build/helpers/build_cmuhelp_modules.py --wheels wheels

      - name: Commit the vendored binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmu_graphics/libs/cmu_graphics_helpers_loader/modules
          if git diff --cached --quiet; then
            echo "Vendored binaries are already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Update vendored cmu_graphics_helpers binaries

          Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA."
          git push

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false # Highly recommended as a good security practice to not store credentials in disk, unless you need this for your specific use case

    - name: Build SDist
      uses: PyO3/maturin-action@v1
      with:
        working-directory: cmu_graphics_helpers
        manylinux: auto
        args: --sdist
        before-script-linux: |
          if command -v yum &> /dev/null; then
            yum install -y freetype-devel fontconfig-devel
          elif command -v apt &> /dev/null; then
            apt update -y
            apt install -y pkg-config libfreetype6-dev libfontconfig1-dev
          fi

    - uses: actions/upload-artifact@v6
      with:
        path: cmu_graphics_helpers/target/wheels/*.tar.gz
        name: source-distribution

  upload_all:
    name: Upload to PyPi
    needs: [build_wheels, test_clean_windows, make_sdist]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/