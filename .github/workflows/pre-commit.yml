name: pre-commit

on:
  push:
    branches-ignore:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Only the dev group (pre-commit and ruff at their uv.lock versions), not
      # the project itself, which would compile the Rust helpers.
      - name: Install pre-commit and ruff
        run: uv sync --only-dev

      - name: Run pre-commit
        id: run
        run: uv run --no-sync pre-commit run --all-files
        continue-on-error: true

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply pre-commit fixes"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi

      - name: Re-run pre-commit to verify
        run: uv run --no-sync pre-commit run --all-files
