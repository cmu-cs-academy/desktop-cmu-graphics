name: CI

# Builds the cmu-graphics wheels once, tests exactly those wheels (as the pip
# distribution, and as a zip distribution made from them), and on a v* tag
# releases them: to PyPI, and as the zip distribution to S3.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# One live run per branch; unlimited runs on main and on release tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Drive build.py and tox with 3.11
  UV_PYTHON: '3.11'

jobs:
  build:
    name: Build the ${{ matrix.platform }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # One universal2 binary for both kinds of Mac, so the zip
          # distribution can hold it next to the Windows one (see build.py).
          # Built on Intel: the x86_64 half cross-compiled on Apple Silicon
          # ran the step-rate test at about half speed on Intel Macs.
          - platform: macos
            os: macos-15-intel
            target: universal2-apple-darwin
          - platform: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: ./.github/actions/rust-build-env

      - name: Build the wheel
        if: matrix.platform != 'linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist

      # manylinux_2_34 rather than the maturin-action default (2014): the wheel
      # bundles the build container's FreeType, and Skia needs FreeType 2.10+
      # (FT_Palette_Data_Get). manylinux2014 ships 2.8, which makes the wheel
      # fail to import. manylinux_2_34 ships 2.10.4, and needs glibc 2.34+
      # (Ubuntu 22.04+).
      - name: Build the manylinux wheel
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          manylinux: 2_34
          # maturin-action has no default container for 2_34
          container: quay.io/pypa/manylinux_2_34_x86_64:latest
          before-script-linux: |
            dnf install -y freetype-devel fontconfig-devel alsa-lib-devel
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: Tests on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs test the same universal2 wheel, one arch each
          - os: macos-latest
            wheel: macos
          - os: macos-15-intel
            wheel: macos
          - os: windows-latest
            wheel: windows
          # tox skips the zip environments on Linux (see tox.ini)
          - os: ubuntu-24.04
            wheel: linux

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist

      # Text rendering needs a font that fontconfig maps to Arial. xvfb-run
      # gives winit's event loop a virtual X display to attach to -- unlike
      # the old SDL backend, winit has no truly headless/dummy mode.
      # libxkbcommon-x11-0 is winit's X11 keyboard backend, not installed by
      # default on the runner image.
      - name: Install fonts and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation xvfb libxkbcommon-x11-0

      # Just tox and the other dev tools. The project itself isn't installed,
      # so nothing here compiles Rust: tox installs the downloaded wheel.
      - name: Install dev dependencies
        run: uv sync --only-dev

      - name: Run tests
        run: |
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          tox=(uv run --no-sync tox run-parallel -p auto --installpkg dist/*.whl)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "${tox[@]}"
          else
            "${tox[@]}"
          fi

      # Save error output generated by test_image_gen.py. This will create
      # one big zip file.
      - name: Upload image comparison failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: image-gen-failures-${{ matrix.os }}
          # report.html sits beside image_gen/, not inside it, and refers to
          # the images by relative path -- so both are needed, with .tox/ as
          # the archive root, for the report to render once unzipped.
          path: |
            .tox/*/tmp/report.html
            .tox/*/tmp/image_gen/**
          # .tox is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # "Tests passed" will be a single stable name to require in
  # Github branch protection, rather than one that contains an
  # OS name.
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [test]
    # Always run this job, even if the previous job failed
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests did not pass: ${{ needs.test.result }}"
            exit 1
          fi

  # Runs on macOS for codesign and notarytool. The release environment holds
  # the signing secrets and requires approval; PyPI trusts this workflow and
  # environment to publish cmu-graphics, and the AWS role trusts them to write
  # the zip distribution to S3.
  release:
    name: Release ${{ github.ref_name }}
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      # PyPI trusted publishing and the AWS role both authenticate with OIDC
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # The version comes from native/Cargo.toml, and the wheel filenames carry
      # it in its PyPI spelling (3.0.1rc1 for Cargo's 3.0.1-rc.1).
      - name: Check that the tag matches the version
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            wheel_version=$(basename "$wheel" | cut -d- -f2)
            if [ "$wheel_version" != "$tag_version" ]; then
              echo "::error::$wheel is version $wheel_version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          # Pre-releases (3.0.1rc1) go to PyPI, where pip ignores them by
          # default, but not to the zip distribution's download.
          if [[ "$tag_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -A -t cert
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          # Search the new keychain, so codesign finds the certificate
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # notarize.py uses tqdm, from the dev group
      - name: Install dev dependencies
        run: uv sync --only-dev

      - name: Build, sign, and notarize the zip distribution
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: uv run --no-sync build/build.py --wheels dist --all-platforms --sign

      - uses: actions/upload-artifact@v7
        with:
          name: zip-distribution
          path: cmu_graphics_installer.zip
          if-no-files-found: error

      # --check-url skips files PyPI already has, so a re-run after a later
      # step failed doesn't fail here.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl

      - name: Get AWS credentials
        if: steps.version.outputs.final == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Cache-control: no-cache means that the zip file can be cached by the
      # browser, but the browser has to validate that it has the latest version
      # before giving it to the user. This should make it so that all users get
      # that latest version ASAP. version.txt goes last, so installed copies
      # aren't told to upgrade before the new zip is there.
      - name: Upload the zip distribution to S3
        if: steps.version.outputs.final == 'true'
        env:
          S3_DEST: s3://cmu-cs-academy.lib.prod/desktop-cmu-graphics/
        run: |
          set -euo pipefail
          echo "${{ steps.version.outputs.version }}" > version.txt
          aws s3 cp --cache-control no-cache cmu_graphics_installer.zip "$S3_DEST"
          aws s3 cp --cache-control no-cache version.txt "$S3_DEST"

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
