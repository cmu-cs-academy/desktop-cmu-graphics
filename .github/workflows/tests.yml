name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One live run per branch; unlimited runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  # Drive build.py and tox with 3.11
  UV_PYTHON: '3.11'

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
        include:
          - os: ubuntu-24.04
            # The zip distribution doesn't support Linux, so only the pip envs
            # run. We also don't run the tox "build-helpers" step/environment
            # so that tox installs the wheel built by linux-helpers-wheel instead
            # of building its own.
            tox-args: -f pip
            # Don't build cmu-graphics-helpers from source; use our wheel
            uv-sync-args: --no-install-package cmu-graphics-helpers

    steps:
      - uses: actions/checkout@v6
        with:
          # build/check_helpers_version.py compares against origin/main, so the
          # default shallow single-ref checkout isn't enough. blob:none keeps the
          # full history without pulling ~324MB of vendored binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Before uv sync, which compiles the helpers crate
      - uses: ./.github/actions/skia-windows-build-env

      - uses: ./.github/actions/linux-helpers-wheel

      # Text rendering needs a font that fontconfig maps to Arial
      - name: Install fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      # Synced once here, so the uv runs below don't re-sync without
      # uv-sync-args
      - name: Install dev dependencies
        run: uv sync ${{ matrix.uv-sync-args }}

      - name: Build the installer zip and pypi package
        run: uv run --no-sync build/build.py

      - name: Run tests
        run: |
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          uv run --no-sync tox run-parallel -p auto ${{ matrix.tox-args }}

      # Save error output generated by test_image_gen.py. This will create
      # one big zip file.
      - name: Upload image comparison failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: image-gen-failures-${{ matrix.os }}
          # report.html sits beside image_gen/, not inside it, and refers to
          # the images by relative path -- so both are needed, with .tox/ as
          # the archive root, for the report to render once unzipped.
          path: |
            .tox/*/tmp/report.html
            .tox/*/tmp/image_gen/**
          # .tox is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # "Tests passed" will be a single stable name to require in
  # Github branch protection, rather than one that contains an
  # OS name.
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [test]
    # Always run this job, even if the previous job failed
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests did not pass: ${{ needs.test.result }}"
            exit 1
          fi
