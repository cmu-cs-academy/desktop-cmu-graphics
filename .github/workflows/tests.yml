name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One live run per branch; unlimited runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Drive build.py and tox with 3.11
  UV_PYTHON: '3.11'

jobs:
  test:
    name: Tests on ${{ matrix.os }}${{ matrix.python-arch && format(' with {0} Python', matrix.python-arch) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-11-arm
            # The Python the zip env must run, checked after the tests
            zip-python-platform: win-arm64
          # x64 Python running under emulation on an ARM computer, as many
          # students' Windows ARM laptops have. sysconfig reports win-amd64
          # there, so the zip distribution's loader must pick the x64 binary.
          - os: windows-11-arm
            python-arch: x64
            zip-python-platform: win-amd64
            # Only the zip distribution has an x64 cmu_graphics_helpers built
            # to test here; the pip env would need one built for x64 on ARM.
            tox-args: -e py311-zip
            uv-sync-args: --no-install-package cmu-graphics-helpers
          - os: ubuntu-24.04
            # The zip distribution doesn't support Linux, so only the pip envs
            # run.
            tox-args: -f pip
            # Don't build cmu-graphics-helpers in the default way; use the wheel
            # built by actions/linux-helpers-wheel
            uv-sync-args: --no-install-package cmu-graphics-helpers

    steps:
      - uses: actions/checkout@v6
        with:
          # build/check_helpers_version.py compares against origin/main, so the
          # default shallow single-ref checkout isn't enough. blob:none keeps the
          # full history without pulling ~324MB of vendored binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # On PATH ahead of the runner's ARM64 Python, so tox (whose uv prefers
      # system Pythons) creates py311-zip with it
      - name: Install x64 Python
        if: matrix.python-arch == 'x64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Check the cmu_graphics_helpers version
        # Only needs the standard library, hence --no-project rather than the
        # synced environment, which doesn't exist yet.
        run: uv run --no-project python build/check_helpers_version.py

      # Before uv sync, which compiles the helpers crate
      - uses: ./.github/actions/rust-build-env
        if: matrix.python-arch != 'x64'

      # Build the Linux cmu_graphics_helpers wheel for manylinux rather than Ubuntu
      - uses: ./.github/actions/linux-helpers-wheel

      # Text rendering needs a font that fontconfig maps to Arial. xvfb-run
      # gives winit's event loop a virtual X display to attach to -- unlike
      # the old SDL backend, winit has no truly headless/dummy mode.
      # libxkbcommon-x11-0 is winit's X11 keyboard backend, not installed by
      # default on the runner image.
      - name: Install fonts and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation xvfb libxkbcommon-x11-0

      # Syncing here builds the cmu-graphics-helpers wheel, which tox
      # will later access directly via UV_FIND_LINKS in tox.ini.
      # Sync here so that the "uv run" below doesn't re-sync without
      # uv-sync-args, which would shadow the manylinux wheel on Linux.
      - name: Install dev dependencies
        run: uv sync ${{ matrix.uv-sync-args }}

      - name: Build the installer zip and pypi package
        run: uv run --no-sync build/build.py

      - name: Run tests
        run: |
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run --no-sync tox run-parallel -p auto ${{ matrix.tox-args }}
          else
            uv run --no-sync tox run-parallel -p auto ${{ matrix.tox-args }}
          fi

      # Guard against the Windows ARM jobs passing on a different Python than
      # the one they're meant to test
      - name: Check which Python the zip env ran
        if: matrix.zip-python-platform
        run: |
          actual=$(.tox/py311-zip/Scripts/python -c "import sysconfig; print(sysconfig.get_platform())")
          echo "py311-zip ran $actual Python"
          if [ "$actual" != "${{ matrix.zip-python-platform }}" ]; then
            echo "::error::py311-zip ran $actual Python, not ${{ matrix.zip-python-platform }}"
            exit 1
          fi

      # Save error output generated by test_image_gen.py. This will create
      # one big zip file.
      - name: Upload image comparison failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: image-gen-failures-${{ matrix.os }}${{ matrix.python-arch && format('-{0}', matrix.python-arch) || '' }}
          # report.html sits beside image_gen/, not inside it, and refers to
          # the images by relative path -- so both are needed, with .tox/ as
          # the archive root, for the report to render once unzipped.
          path: |
            .tox/*/tmp/report.html
            .tox/*/tmp/image_gen/**
          # .tox is a hidden directory, which upload-artifact skips by default
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # "Tests passed" will be a single stable name to require in
  # Github branch protection, rather than one that contains an
  # OS name.
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [test]
    # Always run this job, even if the previous job failed
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests did not pass: ${{ needs.test.result }}"
            exit 1
          fi
