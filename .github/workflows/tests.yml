name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One live run per branch; unlimited runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  # Drive build.py and tox with 3.11
  UV_PYTHON: '3.11'

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          # build/check_helpers_version.py compares against origin/main, so the
          # default shallow single-ref checkout isn't enough. blob:none keeps the
          # full history without pulling ~324MB of vendored binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # tox needs all four interpreters on PATH, as python3.11 ... python3.14.
      # The directory uv installs them into differs by platform, so ask uv for
      # it rather than hardcoding ~/.local/bin.
      - name: Install Python interpreters
        run: |
          uv python install 3.11 3.12 3.13 3.14
          uv python dir --bin >> "$GITHUB_PATH"

      # Windows builds Skia from source, because .cargo/config.toml links the C
      # runtime statically and rust-skia publishes no static prebuilt. That build
      # runs bindgen, which needs libclang; the prebuilt Skia binaries the other
      # platforms download carry pre-generated bindings instead. LLVM is
      # preinstalled on the runner image, so just locate it.
      - name: Point bindgen at the runner's LLVM
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Path "C:\Program Files\LLVM", "C:\Program Files (x86)\LLVM" `
            -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            "found $($lib.FullName)"
            "LIBCLANG_PATH=$($lib.DirectoryName)" >> $env:GITHUB_ENV
          } else {
            "libclang.dll not found; leaving bindgen to search PATH"
          }

      # Must come before build.py: [tool.uv.sources] points cmu-graphics-helpers
      # at the local crate, so `uv run` syncs the project by compiling it -- that
      # step, not tox, is where Skia gets built (485s on the first Windows run).
      #
      # shared-key matches buildwheels.yml so both workflows use one cache
      # instead of each storing its own copy of the same build.
      - name: Cache cargo registry and build artifacts
        if: ${{ runner.os == 'Windows' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cmu_graphics_helpers
          shared-key: windows-skia

      - name: Build the installer zip and pypi package
        run: uv run build/build.py

      - name: Run tests
        run: |
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          uv run tox run-parallel -p auto

      # Save error output generated by test_image_gen.py. This will create
      # one big zip file.
      - name: Upload image comparison failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: image-gen-failures-${{ matrix.os }}
          # report.html sits beside image_gen/, not inside it, and refers to
          # the images by relative path -- so both are needed, with .tox/ as
          # the archive root, for the report to render once unzipped.
          path: |
            .tox/*/tmp/report.html
            .tox/*/tmp/image_gen/**
          retention-days: 7
          if-no-files-found: ignore

  # "Tests passed" will be a single stable name to require in
  # Github branch protection, rather than one that contains an
  # OS name.
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [test]
    # Always run this job, even if the previous job failed
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests did not pass: ${{ needs.test.result }}"
            exit 1
          fi
