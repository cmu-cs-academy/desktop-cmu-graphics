name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One live run per branch; unlimited runs on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  # Drive build.py and tox with 3.11
  UV_PYTHON: '3.11'

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v6
        with:
          # build/check_helpers_version.py compares against origin/main, so the
          # default shallow single-ref checkout isn't enough. blob:none keeps the
          # full history without pulling ~324MB of vendored binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # tox needs all four interpreters on PATH. uv installs them to
      # ~/.local/bin as python3.11 ... python3.14.
      - name: Install Python interpreters
        run: |
          uv python install 3.11 3.12 3.13 3.14
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the installer zip and pypi package
        run: uv run build/build.py

      - name: Run tests
        run: |
          echo "cores: $(sysctl -n hw.ncpu)"
          uv run tox run-parallel -p auto

      # Save error output generated by test_image_gen.py
      - name: Upload image comparison failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: image-gen-failures-${{ matrix.os }}
          path: .tox/*/tmp/image_gen/**
          retention-days: 7
          if-no-files-found: ignore

  # A single stable name to require in branch protection.
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests did not pass: ${{ needs.test.result }}"
            exit 1
          fi
