name: Build the cmu_graphics_helpers wheel on Linux
description: >
  Build the manylinux cmu_graphics_helpers wheel for the runner's architecture
  (x86_64 or aarch64) into cmu_graphics_helpers/target/wheels, the same way for
  publishing and for tests. Does nothing on other platforms.

runs:
  using: composite
  steps:
    # manylinux_2_34 rather than the maturin-action default (2014): the wheel
    # bundles the build container's FreeType, and Skia needs FreeType 2.10+
    # (FT_Palette_Data_Get). manylinux2014 ships 2.8, which makes the wheel
    # fail to import. manylinux_2_34 ships 2.10.4, and needs glibc 2.34+
    # (Ubuntu 22.04+, Debian 12+).
    #
    # The aarch64 wheel builds natively on an ARM runner (ubuntu-24.04-arm),
    # like the Windows ARM wheel does on windows-11-arm, rather than
    # cross-compiling: maturin-action's cross containers only go up to
    # manylinux_2_28, and they'd need an aarch64 FreeType to link and bundle.
    - name: Build wheel with maturin
      if: runner.os == 'Linux'
      uses: PyO3/maturin-action@v1
      with:
        working-directory: cmu_graphics_helpers
        target: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
        manylinux: 2_34
        # maturin-action has no default container for 2_34
        container: quay.io/pypa/manylinux_2_34_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}:latest
        before-script-linux: |
          dnf install -y freetype-devel fontconfig-devel alsa-lib-devel
