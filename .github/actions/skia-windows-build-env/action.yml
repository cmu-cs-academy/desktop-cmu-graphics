name: Prepare to build Skia on Windows
description: >
  Windows builds Skia from source (see .cargo/config.toml). Locate libclang for
  bindgen and restore the cargo cache shared by every workflow that builds it.
  Does nothing on other platforms, which download prebuilt Skia.

runs:
  using: composite
  steps:
    - name: Point bindgen at the runner's LLVM
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lib = Get-ChildItem -Path "C:\Program Files\LLVM", "C:\Program Files (x86)\LLVM" `
          -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($lib) {
          "found $($lib.FullName)"
          "LIBCLANG_PATH=$($lib.DirectoryName)" >> $env:GITHUB_ENV
        } else {
          "libclang.dll not found; leaving bindgen to search PATH"
        }

    - name: Cache cargo registry and build artifacts
      if: runner.os == 'Windows'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cmu_graphics_helpers
        # One key for every caller, so they share a cache instead of each
        # storing a copy of the same build.
        shared-key: windows-skia
