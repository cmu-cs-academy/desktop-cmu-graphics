name: Prepare to build the native extension
description: >
  Windows builds Skia from source (see .cargo/config.toml); locate libclang for
  bindgen there. Also restore the cargo registry/build cache for the crate in
  native/ on Windows and macOS -- Linux builds the wheel in a manylinux Docker
  container (see ci.yml) that this cache can't reach.

runs:
  using: composite
  steps:
    - name: Point bindgen at the runner's LLVM
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lib = Get-ChildItem -Path "C:\Program Files\LLVM", "C:\Program Files (x86)\LLVM" `
          -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($lib) {
          "found $($lib.FullName)"
          "LIBCLANG_PATH=$($lib.DirectoryName)" >> $env:GITHUB_ENV
        } else {
          throw "libclang.dll not found under C:\Program Files\LLVM. bindgen needs it to build Skia from source."
        }

    - name: Cache cargo registry and build artifacts
      if: runner.os != 'Linux'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: native
