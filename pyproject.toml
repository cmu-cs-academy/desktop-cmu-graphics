[project]
name = "cmu-graphics"
dynamic = ["version"]
authors = [
    {name = "Austin Schick", email = "aschick@andrew.cmu.edu"}
]
description = "The graphics framework used by CMU CS Academy, geared toward beginner CS students."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://academy.cs.cmu.edu/"
Documentation = "https://academy.cs.cmu.edu/docs"

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The Rust crate in native/ builds the native extension, cmu_graphics._native,
# which maturin puts inside the cmu_graphics package. Its Cargo.toml holds the
# version.
manifest-path = "native/Cargo.toml"
module-name = "cmu_graphics._native"
# A top-level module next to the cmu_graphics package
include = [{ path = "cmu_cpcs_utils.py", format = "wheel" }]
exclude = [
    "cmu_graphics/**/__pycache__/**",
    # Written at runtime by check_for_update
    "cmu_graphics/updates.json",
]
# maturin's CLI builds debug unless told otherwise, while its PEP 517 backend
# (what uv and tox use) always builds release. Set the profile here so that all
# call sites use release, and share one build cache.
profile = "release"

[tool.ruff]
exclude = ["cmu_graphics/libs", "tests", "build", "cmu_graphics/samples"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"cmu_graphics/*" = ["F401", "F403", "E402"]
# {cmu_graphics.py} uses template macros (custom implementaton), so redefining
# an existing import is unavoidable
"cmu_graphics/cmu_graphics.py" = ["F811"]
"cmu_graphics/modal.py" = ["F811"]
"cmu_graphics/shape_logic.py" = ["F811"]

[dependency-groups]
dev = [
    "pillow",
    "pre-commit",
    "psutil>=7.1.2",
    "ruff>=0.14.2",
    "tox",
    "tox-uv-bare>=1.36.0",
    "tqdm>=4.70.0",
]

[tool.uv]
# uv's default cache invalidation for the project doesn't notice edits to the
# Rust source, so `uv run` would keep using a stale native extension.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/Cargo.toml" },
    { file = "native/Cargo.lock" },
    { file = "native/src/**/*.rs" },
    { file = ".cargo/config.toml" },
]
