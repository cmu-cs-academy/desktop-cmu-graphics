# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        stages: [pre-commit]
        exclude: libs

# Run the ruff from uv.lock rather than ruff-pre-commit's own pinned copy, so
# the hook, CI, and editors all use the same version.
-   repo: local
    hooks:
    -   id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
    -   id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
