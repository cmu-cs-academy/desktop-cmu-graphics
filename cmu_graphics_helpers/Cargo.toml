[package]
name = "cmu-graphics-helpers"
version = "0.1.8"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "cmu_graphics_helpers"
crate-type = ["cdylib"]

[dependencies]
geo = "0.33.1"
geo-booleanop = "0.3.2"
geo-types = "0.7.18"
image = "0.25.10"
reqwest = {version = "0.13.4", features = ["blocking"]}
rodio = "0.22.2"
skia-safe = "0.99.0"
softbuffer = "0.4.8"
winit = "0.30.13"

# For the Dock icon on macOS, which winit's window icon doesn't set. These are
# the versions winit itself uses, so they add no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSData"] }

[dependencies.pyo3]
version = "0.29.0"
features = ["extension-module", "abi3-py38"]

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
