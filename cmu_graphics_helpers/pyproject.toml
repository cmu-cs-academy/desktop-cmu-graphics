[build-system]
requires = ["maturin>=1.12.1,<2.0"]
build-backend = "maturin"

[project]
name = "cmu-graphics-helpers"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
# The Windows wheel ships the Visual C++ runtime DLLs that cmu_graphics_helpers.pyd
# needs to load; build.rs copies them into OUT_DIR and these entries place them
# next to the .pyd, inside the wheel's package directory.
include = [
  { path = "*.dll", from = "out-dir", to = "cmu_graphics_helpers/" },
  { path = "VC_REDIST_NOTICE.txt", from = "out-dir", to = "cmu_graphics_helpers/" },
]

[tool.uv]
# uv's default cache invalidation for this path dependency doesn't notice
# edits to the Rust source, so `uv run` would keep using a stale build.
cache-keys = [
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "build.rs" },
]
